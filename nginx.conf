server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_static on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;

    # Don't cache the SPA shell.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hashed CRA assets are content-addressable; cache forever.
    location ~* ^/static/.*\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico)$ {
        add_header Cache-Control "public, max-age=3600, immutable";
        try_files $uri =404;
    }

    # Mirrors the prior piplup config: try $uri, $uri.html, then SPA fallback.
    location / {
        try_files $uri $uri.html /index.html =404;
    }
}
